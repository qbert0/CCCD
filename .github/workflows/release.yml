name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version cho bản build thủ công (không có tag), vd 1.2.3"
        default: "0.0.0-manual"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài thư viện hệ thống cho PyQt5 (chế độ offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 fontconfig

      - uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-linux-${{ hashFiles('desktop_app/requirements.txt') }}

      - name: Xác định phiên bản
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version || '0.0.0-manual' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cài môi trường
        run: ./desktop_app/install.sh

      - name: Build PyInstaller
        run: ./desktop_app/build.sh

      - name: Kiểm tra nhanh bản build
        run: QT_QPA_PLATFORM=offscreen ./product/CCCDReport/CCCDReport --self-test-full

      - name: Đóng gói AppImage
        run: ./desktop_app/packaging/linux/make_appimage.sh "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist_installers/*.AppImage

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-windows-${{ hashFiles('desktop_app/requirements.txt') }}

      - name: Xác định phiên bản
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version || '0.0.0-manual' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cài môi trường
        run: ./desktop_app/install.sh

      - name: Build PyInstaller
        run: ./desktop_app/build.sh

      - name: Kiểm tra nhanh bản build
        run: QT_QPA_PLATFORM=offscreen ./product/CCCDReport/CCCDReport.exe --self-test-full

      - name: Cài Inno Setup
        shell: cmd
        run: choco install innosetup -y

      - name: Đóng gói trình cài đặt Windows
        shell: cmd
        run: |
          iscc /DMyAppVersion=${{ steps.version.outputs.value }} desktop_app\packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist_installers/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-macos-${{ hashFiles('desktop_app/requirements.txt') }}

      - name: Xác định phiên bản
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version || '0.0.0-manual' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cài môi trường
        run: ./desktop_app/install.sh

      - name: Build PyInstaller
        run: ./desktop_app/build.sh

      - name: Kiểm tra nhanh bản build
        run: QT_QPA_PLATFORM=offscreen ./product/CCCDReport.app/Contents/MacOS/CCCDReport --self-test-full

      - name: Đóng gói .dmg
        run: ./desktop_app/packaging/macos/make_dmg.sh "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist_installers/*.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist_installers
          merge-multiple: true

      - name: Tạo GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installers/*
          generate_release_notes: true
